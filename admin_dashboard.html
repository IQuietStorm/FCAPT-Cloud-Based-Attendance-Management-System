<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Console | FCAPT</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header header--admin">
        <div class="header-brand">
            <img src="logo.svg" alt="FCAPT Logo" class="header-logo" onerror="this.onerror=null;this.src='logo.png';">
            <div class="header-brand-text">
                <h2>FCAPT Administrator</h2>
            </div>
        </div>
        <div class="header-actions">
            <button class="icon-btn" type="button" onclick="toggleTheme()" aria-label="Toggle dark mode" title="Toggle theme">🌓</button>
            <button type="button" class="btn-logout" onclick="logout()">Logout</button>
        </div>
    </header>

    <div class="nav-tabs">
        <div class="tab active" onclick="showTab('system')">Semester</div>
        <div class="tab" onclick="showTab('users')">Manage Users</div>
        <div class="tab" onclick="showTab('courses')">Course Management</div>
    </div>

    <main class="container container--admin">
        
        <section id="tab-system" class="card">
            <h3 class="card-title">Semester Parameters</h3>
            <div class="grid">
                <div class="form-group">
                    <label>Resumption Date</label>
                    <input type="date" id="res_date">
                </div>
                <div class="form-group">
                    <label>Semester End Date</label>
                    <input type="date" id="end_date">
                </div>
            </div>
            <button class="btn-action" onclick="saveSettings()">Update Dates</button>
        </section>

        <section id="tab-users" class="card hidden">
            <h3 class="card-title">Add New Student / Lecturer</h3>
            <div class="grid">
                <div class="form-group"><label>Full Name</label><input type="text" id="user_name"></div>
                <div class="form-group"><label>ID / Reg Number</label><input type="text" id="user_id"></div>
                <div class="form-group">
                    <label>Role</label>
                    <select id="user_role" onchange="toggleStudentFields()">
                        <option value="student">Student</option>
                        <option value="lecturer">Lecturer</option>
                    </select>
                </div>
                <div class="form-group"><label>Initial Password</label><input type="text" id="user_pass" value="Fcapt123"></div>
            </div>

            <div id="student_fields" class="grid">
                <div class="form-group">
                    <label>Program</label>
                    <select id="user_prog">
                        <option value="AEM">AEM</option><option value="AHP">AHP</option>
                        <option value="CEM">CEM</option><option value="CPS">CPS</option><option value="NCC">NCC</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Class</label>
                    <select id="user_class">
                        <option value="ND I">ND I</option><option value="ND II">ND II</option>
                        <option value="Pre-HND">Pre-HND</option><option value="HND I">HND I</option><option value="HND II">HND II</option>
                    </select>
                </div>
            </div>
            <button class="btn-action" onclick="addUser()">Create Profile</button>
        </section>

        <section id="tab-courses" class="card hidden">
            <div id="course-form-container">
                <h3 id="course-form-title" class="card-title">Create New Course</h3>
                <input type="hidden" id="edit_course_id">
                <div class="grid">
                    <div class="form-group"><label>Course Code</label><input type="text" id="c_code"></div>
                    <div class="form-group"><label>Course Title</label><input type="text" id="c_title"></div>
                    <div class="form-group">
                        <label>Assigned Lecturer</label>
                        <select id="c_lecturer"><option value="">-- Select Lecturer --</option></select>
                    </div>
                </div>
                <button class="btn-action" id="course-submit-btn" onclick="handleCourseSubmit()">Save Course</button>
                <button class="btn-action btn-secondary hidden" id="cancel-edit-btn" onclick="resetCourseForm()">Cancel Edit</button>
            </div>

            <h3 class="card-title card-title--spaced">Existing Course Registry</h3>
            <div class="table-wrap">
                <table id="course-table">
                    <thead><tr><th>Code</th><th>Title</th><th>Lecturer</th><th>Action</th></tr></thead>
                    <tbody id="course-list"></tbody>
                </table>
            </div>
        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SB_URL = 'https://loblicverqcijkqatvhs.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvYmxpY3ZlcnFjaWprcWF0dmhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMTAyOTYsImV4cCI6MjA5MTY4NjI5Nn0.vV-rpPzniYgSTzBStfikL_SJc722-41ezkiJnI4nOPs';
        const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('fcapt_theme', theme);
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            setTheme(current === 'dark' ? 'light' : 'dark');
        }

        (function initTheme() {
            const saved = localStorage.getItem('fcapt_theme');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            setTheme(saved || (prefersDark ? 'dark' : 'light'));
        })();

        function showTab(tabId) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.remove('hidden');
            event.target.classList.add('active');
            if(tabId === 'courses') loadCourseData();
        }

        function toggleStudentFields() {
            const role = document.getElementById('user_role').value;
            document.getElementById('student_fields').style.display = (role === 'student') ? 'grid' : 'none';
        }

        async function loadCourseData() {
            const { data: lecs } = await supabaseClient.from('profiles').select('id, full_name').eq('role', 'lecturer');
            const lecSelect = document.getElementById('c_lecturer');
            lecSelect.innerHTML = '<option value="">-- Select Lecturer --</option>';
            lecs.forEach(l => lecSelect.innerHTML += `<option value="${l.id}">${l.full_name}</option>`);

            const { data: courses } = await supabaseClient.from('courses').select('*, profiles(full_name)');
            const list = document.getElementById('course-list');
            list.innerHTML = '';
            courses.forEach(c => {
                list.innerHTML += `<tr>
                    <td><strong>${c.course_code}</strong></td>
                    <td>${c.course_title}</td>
                    <td>${c.profiles ? c.profiles.full_name : '<span style="color:red">Unassigned</span>'}</td>
                    <td><button class="btn-action btn-edit" onclick='prepEdit(${JSON.stringify(c)})'>Edit / Reassign</button></td>
                </tr>`;
            });
        }

        function prepEdit(course) {
            document.getElementById('tab-courses').scrollIntoView();
            document.getElementById('course-form-container').classList.add('editing-mode');
            document.getElementById('course-form-title').innerText = "Edit Course & Reassign Lecturer";
            
            document.getElementById('edit_course_id').value = course.id;
            document.getElementById('c_code').value = course.course_code;
            document.getElementById('c_title').value = course.course_title;
            document.getElementById('c_lecturer').value = course.lecturer_id || "";
            
            document.getElementById('course-submit-btn').innerText = "Update Course Details";
            document.getElementById('cancel-edit-btn').classList.remove('hidden');
        }

        async function handleCourseSubmit() {
            const id = document.getElementById('edit_course_id').value;
            const payload = {
                course_code: document.getElementById('c_code').value,
                course_title: document.getElementById('c_title').value,
                lecturer_id: document.getElementById('c_lecturer').value || null
            };

            if (id) {
                // Update Existing
                const { error } = await supabaseClient.from('courses').update(payload).eq('id', id);
                if(!error) { alert("Course reassigned successfully!"); resetCourseForm(); loadCourseData(); }
            } else {
                // Create New
                const { error } = await supabaseClient.from('courses').insert([payload]);
                if(!error) { alert("New course created!"); resetCourseForm(); loadCourseData(); }
            }
        }

        function resetCourseForm() {
            document.getElementById('course-form-container').classList.remove('editing-mode');
            document.getElementById('course-form-title').innerText = "Create New Course";
            document.getElementById('edit_course_id').value = "";
            document.getElementById('c_code').value = "";
            document.getElementById('c_title').value = "";
            document.getElementById('c_lecturer').value = "";
            document.getElementById('course-submit-btn').innerText = "Save Course";
            document.getElementById('cancel-edit-btn').classList.add('hidden');
        }

        async function addUser() {
            const role = document.getElementById('user_role').value;
            const payload = {
                full_name: document.getElementById('user_name').value,
                reg_num: document.getElementById('user_id').value,
                password: document.getElementById('user_pass').value,
                role: role,
                program: role === 'student' ? document.getElementById('user_prog').value : null,
                student_class: role === 'student' ? document.getElementById('user_class').value : null
            };
            const { error } = await supabaseClient.from('profiles').insert([payload]);
            if(!error) { alert("User Profile Created!"); } else { alert(error.message); }
        }

        async function saveSettings() {
            const { error } = await supabaseClient.from('settings').update({
                resumption_date: document.getElementById('res_date').value,
                semester_end_date: document.getElementById('end_date').value
            }).eq('id', 1);
            if(!error) alert("Semester timeline updated!");
        }

        function logout() { localStorage.clear(); window.location.href = 'index.html'; }
        
        // Initial setup for dates
        (async () => {
            const { data } = await supabaseClient.from('settings').select('*').single();
            if(data) {
                document.getElementById('res_date').value = data.resumption_date;
                document.getElementById('end_date').value = data.semester_end_date;
            }
        })();
    </script>
</body>
</html>

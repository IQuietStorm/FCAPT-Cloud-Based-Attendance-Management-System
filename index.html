<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FCAPT Portal | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --fcapt-green: #2d5a27; --accent-gold: #c5a059; }
        body { font-family: 'Inter', sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 2.5rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 380px; border-top: 5px solid var(--fcapt-green); }
        .input-group { margin-top: 1.2rem; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9rem; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .btn { width: 100%; background: var(--fcapt-green); color: white; padding: 14px; border: none; border-radius: 6px; margin-top: 1.5rem; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="color: var(--fcapt-green); margin-top: 0;">FCAPT Portal</h2>
        <form id="loginForm">
            <div class="input-group">
                <label>ID Number</label>
                <input type="text" id="reg_num" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn" id="loginBtn">Sign In</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SB_URL = 'https://loblicverqcijkqatvhs.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvYmxpY3ZlcnFjaWprcWF0dmhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMTAyOTYsImV4cCI6MjA5MTY4NjI5Nn0.vV-rpPzniYgSTzBStfikL_SJc722-41ezkiJnI4nOPs';
        const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const reg = document.getElementById('reg_num').value.trim();
            const pass = document.getElementById('password').value;

            const { data, error } = await supabaseClient.from('profiles').select('*').eq('reg_num', reg).single();

            if (error || !data || data.password !== pass) {
                alert("Invalid Credentials");
            } else {
                localStorage.setItem('fcapt_user', JSON.stringify(data));
                
                // Redirect based on ROLE, not name
                if (data.role === 'admin') {
                    window.location.href = 'admin_dashboard.html';
                } else if (data.role === 'lecturer') {
                    window.location.href = 'lecturer_dashboard.html';
                } else {
                    window.location.href = 'student_portal.html';
                }
            }
        });
    </script>
</body>
</html>

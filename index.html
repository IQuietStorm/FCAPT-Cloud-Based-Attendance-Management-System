<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FCAPT Portal | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-login">

    <div class="card login-card">
        <img src="logo.svg" alt="FCAPT Logo" class="logo" onerror="this.onerror=null;this.src='logo.png';">
        <h2>FCAPT Portal | Login</h2>

        <form id="loginForm">
            <div class="input-group">
                <label for="reg_num">ID Number</label>
                <input type="text" id="reg_num" placeholder="Enter your ID" required autocomplete="username">
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn">Sign In</button>
        </form>
    </div>

    <div id="profileModal" class="modal">
        <div class="modal-content">
            <h3>Complete Your Profile</h3>
            <label for="set-program">Program</label>
            <select id="set-program">
                <option value="AEM">AEM</option>
                <option value="AHP">AHP</option>
                <option value="CEM">CEM</option>
                <option value="CPS">CPS</option>
                <option value="NCC">NCC</option>
            </select>
            <label for="set-class" class="field-spaced">Class</label>
            <select id="set-class">
                <option value="ND I">ND I</option>
                <option value="ND II">ND II</option>
                <option value="Pre-HND">Pre-HND</option>
                <option value="HND I">HND I</option>
                <option value="HND II">HND II</option>
            </select>
            <button type="button" class="btn" onclick="submitProfile()">Save &amp; Enter</button>
        </div>
    </div>

    <button type="button" class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">🌓</button>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SB_URL = 'https://loblicverqcijkqatvhs.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvYmxpY3ZlcnFjaWprcWF0dmhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMTAyOTYsImV4cCI6MjA5MTY4NjI5Nn0.vV-rpPzniYgSTzBStfikL_SJc722-41ezkiJnI4nOPs';
        const supabaseClient = supabase.createClient(SB_URL, SB_KEY);
        let activeUser = null;

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const target = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', target);
            localStorage.setItem('fcapt_theme', target);
        }
        document.documentElement.setAttribute('data-theme', localStorage.getItem('fcapt_theme') || 'light');

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const { data, error } = await supabaseClient.from('profiles').select('*').eq('reg_num', document.getElementById('reg_num').value.trim()).single();
            if (!error && data && data.password === document.getElementById('password').value) {
                activeUser = data;
                localStorage.setItem('fcapt_user', JSON.stringify(data));
                if (data.role === 'student' && !data.program) {
                    document.getElementById('profileModal').classList.add('open');
                } else { redirect(data); }
            } else { alert('Login Failed'); }
        });

        async function submitProfile() {
            const p = document.getElementById('set-program').value;
            const c = document.getElementById('set-class').value;
            await supabaseClient.from('profiles').update({ program: p, student_class: c }).eq('id', activeUser.id);
            activeUser.program = p;
            activeUser.student_class = c;
            localStorage.setItem('fcapt_user', JSON.stringify(activeUser));
            redirect(activeUser);
        }

        function redirect(u) {
            if (u.role === 'admin') window.location.href = 'admin_dashboard.html';
            else if (u.role === 'lecturer') window.location.href = 'lecturer_dashboard.html';
            else window.location.href = 'student_portal.html';
        }
    </script>
</body>
</html>

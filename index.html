<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | FCAPT Kano</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-card { width: 100%; max-width: 400px; border-bottom: 6px solid var(--fcapt-primary); }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); }
        .modal-content { margin: 10% auto; max-width: 400px; }
    </style>
</head>
<body>

    <div class="card login-card">
        <div style="text-align: center; margin-bottom: 2rem;">
            <h2 style="color: var(--fcapt-primary); margin: 0;">FCAPT PORTAL</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Cloud Attendance System</p>
        </div>
        <form id="loginForm">
            <div style="margin-bottom: 1.5rem;">
                <label>ID / Registration Number</label>
                <input type="text" id="reg_num" placeholder="e.g. Administrator" required>
            </div>
            <div style="margin-bottom: 1.5rem;">
                <label>Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn" style="width: 100%;">Sign In</button>
        </form>
    </div>

    <div id="profileModal" class="modal">
        <div class="card modal-content">
            <h3 style="margin-top:0;">Complete Profile</h3>
            <label>Program</label>
            <select id="set-program">
                <option value="AEM">AEM</option><option value="AHP">AHP</option>
                <option value="CEM">CEM</option><option value="CPS">CPS</option><option value="NCC">NCC</option>
            </select>
            <label style="margin-top:1rem;">Class</label>
            <select id="set-class">
                <option value="ND I">ND I</option><option value="ND II">ND II</option>
                <option value="Pre-HND">Pre-HND</option><option value="HND I">HND I</option><option value="HND II">HND II</option>
            </select>
            <button class="btn" onclick="submitProfile()" style="width:100%; margin-top:1.5rem;">Save & Enter</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="main.js"></script>
    <script>
        const SB_URL = 'https://loblicverqcijkqatvhs.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvYmxpY3ZlcnFjaWprcWF0dmhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMTAyOTYsImV4cCI6MjA5MTY4NjI5Nn0.vV-rpPzniYgSTzBStfikL_SJc722-41ezkiJnI4nOPs';
        const supabaseClient = supabase.createClient(SB_URL, SB_KEY);
        let activeUser = null;

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const { data, error } = await supabaseClient.from('profiles').select('*')
                .eq('reg_num', document.getElementById('reg_num').value.trim()).single();

            if (!error && data && data.password === document.getElementById('password').value) {
                activeUser = data;
                localStorage.setItem('fcapt_user', JSON.stringify(data));
                if (data.role === 'student' && !data.program) {
                    document.getElementById('profileModal').style.display = 'block';
                } else {
                    redirectUser(data);
                }
            } else { alert("Invalid Credentials"); }
        });

        async function submitProfile() {
            const prog = document.getElementById('set-program').value;
            const cls = document.getElementById('set-class').value;
            await supabaseClient.from('profiles').update({ program: prog, student_class: cls }).eq('id', activeUser.id);
            activeUser.program = prog; activeUser.student_class = cls;
            localStorage.setItem('fcapt_user', JSON.stringify(activeUser));
            redirectUser(activeUser);
        }
    </script>
</body>
</html>

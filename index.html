<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FCAPT Portal | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --fcapt-primary: #1e4620; --fcapt-bg: #f8fafc; --white: #ffffff; }
        body { font-family: 'Inter', sans-serif; background: var(--fcapt-bg); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: var(--white); padding: 2.5rem; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 380px; border-bottom: 6px solid var(--fcapt-primary); }
        .logo-area { text-align: center; margin-bottom: 1.5rem; }
        .logo-area h2 { color: var(--fcapt-primary); margin: 0; }
        .input-group { margin-top: 1.2rem; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.85rem; color: #475569; }
        input, select { width: 100%; padding: 12px; border: 1.5px solid #e2e8f0; border-radius: 8px; box-sizing: border-box; outline: none; }
        .btn { width: 100%; background: var(--fcapt-primary); color: white; padding: 14px; border: none; border-radius: 8px; margin-top: 2rem; font-weight: 700; cursor: pointer; }
        
        /* Modal for Program/Class Setup */
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); }
        .modal-content { background: white; margin: 10% auto; padding: 30px; border-radius: 12px; width: 90%; max-width: 400px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo-area">
            <h2>FCAPT KANO</h2>
            <p style="color:#64748b; font-size:0.9rem;">Cloud Attendance System</p>
        </div>
        <form id="loginForm">
            <div class="input-group">
                <label>ID Number</label>
                <input type="text" id="reg_num" placeholder="e.g. Administrator or Student ID" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn">Sign In</button>
        </form>
    </div>

    <div id="profileModal" class="modal">
        <div class="modal-content">
            <h3 style="color: var(--fcapt-primary); margin-top:0;">Complete Your Profile</h3>
            <p style="font-size:0.85rem; color:#666; margin-bottom:20px;">Please set your academic details to continue.</p>
            <label>Academic Program</label>
            <select id="set-program">
                <option value="AEM">AEM (Agric Extension & Management)</option>
                <option value="AHP">AHP (Animal Health & Production)</option>
                <option value="CEM">CEM (Cooperative Economics & Management)</option>
                <option value="CPS">CPS (Computer Science)</option>
                <option value="NCC">NCC (Networking & Cloud Computing)</option>
            </select>
            <label style="margin-top:15px;">Class</label>
            <select id="set-class">
                <option value="ND I">ND I</option>
                <option value="ND II">ND II</option>
                <option value="Pre-HND">Pre-HND</option>
                <option value="HND I">HND I</option>
                <option value="HND II">HND II</option>
            </select>
            <button class="btn" onclick="submitProfile()">Enter Portal</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SB_URL = 'https://loblicverqcijkqatvhs.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvYmxpY3ZlcnFjaWprcWF0dmhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMTAyOTYsImV4cCI6MjA5MTY4NjI5Nn0.vV-rpPzniYgSTzBStfikL_SJc722-41ezkiJnI4nOPs';
        const supabaseClient = supabase.createClient(SB_URL, SB_KEY);
        let activeUser = null;

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const reg = document.getElementById('reg_num').value.trim();
            const pass = document.getElementById('password').value;

            const { data, error } = await supabaseClient.from('profiles').select('*').eq('reg_num', reg).single();

            if (error || !data || data.password !== pass) {
                alert("Invalid Credentials");
            } else {
                activeUser = data;
                localStorage.setItem('fcapt_user', JSON.stringify(data));
                
                // If student role is missing Program/Class, show modal
                if (data.role === 'student' && (!data.program || !data.student_class)) {
                    document.getElementById('profileModal').style.display = 'block';
                } else {
                    redirectUser(data);
                }
            }
        });

        async function submitProfile() {
            const prog = document.getElementById('set-program').value;
            const cls = document.getElementById('set-class').value;
            
            const { error } = await supabaseClient.from('profiles').update({ 
                program: prog, 
                student_class: cls 
            }).eq('id', activeUser.id);

            if (!error) {
                activeUser.program = prog;
                activeUser.student_class = cls;
                localStorage.setItem('fcapt_user', JSON.stringify(activeUser));
                redirectUser(activeUser);
            }
        }

        function redirectUser(user) {
            if (user.role === 'admin') window.location.href = 'admin_dashboard.html';
            else if (user.role === 'lecturer') window.location.href = 'lecturer_dashboard.html';
            else window.location.href = 'student_portal.html';
        }
    </script>
</body>
</html>

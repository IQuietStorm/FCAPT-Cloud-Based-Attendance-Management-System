<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FCAPT Student Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --fcapt-primary: #1e4620;
            --fcapt-bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --accent: #3b82f6;
        }

        [data-theme="dark"] {
            --fcapt-bg: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--fcapt-bg);
            color: var(--text-main);
            margin: 0;
            transition: 0.3s;
            padding-bottom: 40px;
        }

        /* Navigation */
        nav {
            background: var(--card-bg);
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header Card - Responsive */
        .header-card {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        @media (min-width: 768px) {
            .header-card { flex-direction: row; justify-content: space-between; align-items: center; }
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        @media (min-width: 768px) {
            .stats-grid { grid-template-columns: repeat(3, 1fr); }
        }

        .stat-box {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .stat-label { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); uppercase; letter-spacing: 0.05em; }
        .stat-value { font-size: 1.5rem; font-weight: 800; margin-top: 5px; color: var(--fcapt-primary); }

        /* Table Area */
        .table-container {
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: var(--fcapt-bg); padding: 15px; font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; }
        td { padding: 15px; border-top: 1px solid var(--border-color); font-size: 0.95rem; }

        .theme-toggle {
            width: 40px; height: 40px; border-radius: 50%;
            background: var(--fcapt-primary); color: white;
            border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }

        .badge { background: #dcfce7; color: #166534; padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
    </style>
</head>
<body>

    <nav>
        <div style="font-weight: 800; color: var(--fcapt-primary);">FCAPT | PORTAL</div>
        <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
    </nav>

    <div class="container">
        <div class="header-card">
            <div>
                <span class="stat-label">Student Name</span>
                <h2 style="margin: 5px 0; font-size: 1.8rem;" id="disp-name"> </h2>
                <span document.getElementById('disp-reg-num').innerText = student.reg_num || 'N/A'; </span>
            </div>
            <div style="text-align: right;">
                <span class="badge">Week 8</span>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-label">Attendance</div>
                <div class="stat-value" id="disp-attendance">0%</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Program</div>
                <div class="stat-value" id="disp-program" style="font-size: 1.2rem;">---</div>
            </div>
            <div class="stat-box">
                <div class="stat-box-inner">
                    <div class="stat-label">Class</div>
                    <div class="stat-value" id="disp-class" style="font-size: 1.2rem;">---</div>
                </div>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Course Module</th>
                        <th style="text-align: right;">Attendance</th>
                    </tr>
                </thead>
                <tbody id="course-list">
                    <tr>
                        <td>Synchronizing Cloud Data...</td>
                        <td style="text-align: right;">--</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SB_URL = 'https://loblicverqcijkqatvhs.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvYmxpY3ZlcnFjaWprcWF0dmhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMTAyOTYsImV4cCI6MjA5MTY4NjI5Nn0.vV-rpPzniYgSTzBStfikL_SJc722-41ezkiJnI4nOPs';
    const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

    // 1. Theme Logic (Keep this)
    function toggleTheme() {
        const current = document.documentElement.getAttribute('data-theme');
        const target = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', target);
        localStorage.setItem('fcapt_theme', target);
    }
    document.documentElement.setAttribute('data-theme', localStorage.getItem('fcapt_theme') || 'light');

    // 2. Data Fetching Logic
    async function loadStudentData() {
        // Get user from localStorage (saved during login)
        const cachedUser = JSON.parse(localStorage.getItem('fcapt_user'));

        if (!cachedUser) {
            window.location.href = 'index.html'; // Redirect to login if no session
            return;
        }

        try {
            // Fetch fresh data from Supabase to get attendance and courses
            // Assuming your table is 'profiles' based on your login code
            const { data: student, error } = await supabaseClient
                .from('profiles')
                .select('*')
                .eq('id', cachedUser.id)
                .single();

            if (error) throw error;

            // Populate UI Elements
            document.getElementById('disp-name').innerText = student.full_name || 'Student';
            document.getElementById('disp-attendance').innerText = (student.overall_attendance || 0) + '%';
            document.getElementById('disp-program').innerText = student.program || 'N/A';
            document.getElementById('disp-class').innerText = student.student_class || 'N/A';

            // Populate Course Table
            const courseContainer = document.getElementById('course-list');
            
            // Check if course_data exists and is an array
            if (student.course_data && Array.isArray(student.course_data)) {
                courseContainer.innerHTML = ''; // Clear the "Synchronizing..." message
                student.course_data.forEach(course => {
                    courseContainer.innerHTML += `
                        <tr>
                            <td>${course.name}</td>
                            <td style="text-align: right; font-weight: 700; color: var(--fcapt-primary);">
                                ${course.attendance}%
                            </td>
                        </tr>
                    `;
                });
            } else {
                courseContainer.innerHTML = '<tr><td colspan="2" style="text-align:center; color:var(--text-muted);">No course records found.</td></tr>';
            }

        } catch (err) {
            console.error("Portal Error:", err);
            document.getElementById('disp-name').innerText = "Error Loading Data";
        }
    }

    // Initialize on load
    window.onload = loadStudentData;
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal | FCAPT</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header header--portal">
        <div class="header-brand">
            <img src="logo.svg" alt="FCAPT Logo" class="header-logo" onerror="this.onerror=null;this.src='logo.png';">
            <div class="header-brand-text">
                <h2 id="user-name">...</h2>
                <small id="profile-info">...</small>
            </div>
        </div>
        <div class="header-actions">
            <button class="icon-btn" type="button" onclick="toggleTheme()" aria-label="Toggle dark mode" title="Toggle theme">🌓</button>
            <button type="button" class="btn-logout" onclick="logout()">Logout</button>
        </div>
    </header>
    <main class="container container--narrow">
        <div class="card">
            <h3 class="card-title">My Attendance</h3>
            <div id="attendance-list">Loading...</div>
        </div>
        <div class="card">
            <h3 class="card-title">Daily Check-in</h3>
            <p id="checkin-hint" class="checkin-hint">Week —</p>
            <select id="course-select"><option value="">-- Choose Course --</option></select>
            <button id="mark-btn" class="btn-mark" onclick="markAtt()">Mark Presence</button>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SB_URL = 'https://loblicverqcijkqatvhs.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvYmxpY3ZlcnFjaWprcWF0dmhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMTAyOTYsImV4cCI6MjA5MTY4NjI5Nn0.vV-rpPzniYgSTzBStfikL_SJc722-41ezkiJnI4nOPs';
        const supabaseClient = supabase.createClient(SB_URL, SB_KEY);
        const user = JSON.parse(localStorage.getItem('fcapt_user'));
        let currentWeek = 1;
        let totalWeeks = 12;
        let checkedCourseIdsThisWeek = new Set();

        function hasCheckedInThisWeek(courseId) {
            return checkedCourseIdsThisWeek.has(String(courseId));
        }

        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('fcapt_theme', theme);
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            setTheme(current === 'dark' ? 'light' : 'dark');
        }

        (function initTheme() {
            const saved = localStorage.getItem('fcapt_theme');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            setTheme(saved || (prefersDark ? 'dark' : 'light'));
        })();

        async function init() {
            if (!user) window.location.href = 'index.html';
            document.getElementById('user-name').innerText = user.full_name;
            document.getElementById('profile-info').innerText = `${user.program} • ${user.student_class}`;

            const { data: settings } = await supabaseClient.from('settings').select('*').single();
            const start = new Date(settings.resumption_date);
            const end = new Date(settings.semester_end_date);
            totalWeeks = Math.ceil((end - start) / (7 * 24 * 60 * 60 * 1000));
            currentWeek = Math.max(1, Math.ceil((new Date() - start) / (7 * 24 * 60 * 60 * 1000)));

            const { data: courses } = await supabaseClient.from('courses').select('*');
            const { data: att } = await supabaseClient
                .from('attendance')
                .select('course_id, week_number')
                .eq('student_id', user.id);

            checkedCourseIdsThisWeek = new Set(
                (att || [])
                    .filter(a => Number(a.week_number) === Number(currentWeek))
                    .map(a => String(a.course_id))
            );
            
            const list = document.getElementById('attendance-list');
            const sel = document.getElementById('course-select');
            const markBtn = document.getElementById('mark-btn');
            const checkinHint = document.getElementById('checkin-hint');
            list.innerHTML = '';
            sel.innerHTML = '<option value="">-- Choose Course --</option>';

            let availableCount = 0;
            (courses || []).forEach(c => {
                const count = (att || []).filter(a => a.course_id === c.id).length;
                const checkedThisWeek = hasCheckedInThisWeek(c.id);
                const p = Math.round((count / totalWeeks) * 100);
                list.innerHTML += `<div class="course-item">
                    <div><strong>${c.course_code}</strong><br>
                    ${checkedThisWeek ? '<span class="week-checked">Checked in this week</span><br>' : ''}
                    ${p < 75 && currentWeek >= 9 ? '<span style="color:var(--danger); font-size:0.7rem;">SHORTFALL</span>' : ''}</div>
                    <div style="display:flex; align-items:center;"><span>${p}%</span><div class="progress-bar"><div class="progress-inner" style="width:${p}%"></div></div></div>
                </div>`;
                if (!checkedThisWeek) {
                    sel.innerHTML += `<option value="${c.id}">${c.course_code}</option>`;
                    availableCount++;
                }
            });

            checkinHint.textContent = availableCount
                ? `Week ${currentWeek} — select a course you have not checked in for this week.`
                : `Week ${currentWeek} — you have already checked in for all courses this week.`;
            markBtn.disabled = availableCount === 0;
        }
        async function markAtt() {
            const cid = document.getElementById('course-select').value;
            if (!cid) {
                alert('Please choose a course before marking presence.');
                return;
            }

            if (hasCheckedInThisWeek(cid)) {
                alert(`You have already checked in for this course in Week ${currentWeek}.`);
                return;
            }

            const { data: existing } = await supabaseClient
                .from('attendance')
                .select('id')
                .eq('student_id', user.id)
                .eq('course_id', cid)
                .eq('week_number', currentWeek)
                .maybeSingle();

            if (existing) {
                checkedCourseIdsThisWeek.add(String(cid));
                alert(`You have already checked in for this course in Week ${currentWeek}.`);
                return;
            }

            const { error } = await supabaseClient.from('attendance').insert([{
                student_id: user.id,
                course_id: cid,
                week_number: currentWeek
            }]);

            if (error) {
                const duplicate = error.code === '23505' || /duplicate|unique/i.test(error.message || '');
                alert(duplicate
                    ? `You have already checked in for this course in Week ${currentWeek}.`
                    : (error.message || 'Could not record check-in.'));
                return;
            }

            const { data: course } = await supabaseClient
                .from('courses')
                .select('lecturer_id, course_code')
                .eq('id', cid)
                .single();

            if (course?.lecturer_id) {
                await supabaseClient.from('notifications').insert([{
                    lecturer_id: course.lecturer_id,
                    student_id: user.id,
                    course_id: cid,
                    student_name: user.full_name,
                    course_code: course.course_code,
                    week_number: currentWeek,
                    message: `${user.full_name} marked presence for ${course.course_code} (Week ${currentWeek})`,
                    read: false
                }]);

                if (typeof BroadcastChannel !== 'undefined') {
                    const channel = new BroadcastChannel('fcapt-presence');
                    channel.postMessage({
                        lecturerId: course.lecturer_id,
                        studentName: user.full_name,
                        courseCode: course.course_code,
                        weekNumber: currentWeek,
                        createdAt: new Date().toISOString()
                    });
                    channel.close();
                }
            }

            alert('Check-in recorded.');
            location.reload();
        }
        function logout() { localStorage.clear(); window.location.href = 'index.html'; }
        init();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FCAPT | Student Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --fcapt-primary: #1e4620; --fcapt-bg: #f8fafc; --card-bg: #ffffff; --text-main: #1e293b; --text-muted: #64748b; --border-color: #e2e8f0; }
        [data-theme="dark"] { --fcapt-bg: #0f172a; --card-bg: #1e293b; --text-main: #f1f5f9; --border-color: #334155; }
        body { font-family: 'Inter', sans-serif; background: var(--fcapt-bg); color: var(--text-main); margin: 0; padding-bottom: 80px; }
        .header { background: var(--fcapt-primary); color: white; padding: 1.5rem; text-align: center; }
        .logo-img { height: 50px; margin-bottom: 10px; filter: brightness(0) invert(1); }
        .container { max-width: 500px; margin: 1.5rem auto; padding: 0 15px; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 24px; margin-bottom: 20px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .user-badge { font-size: 0.85rem; background: rgba(255,255,255,0.2); padding: 4px 12px; border-radius: 99px; display: inline-block; margin-top: 8px; }
        select { width: 100%; padding: 14px; border-radius: 10px; border: 2px solid var(--border-color); background: var(--card-bg); color: var(--text-main); margin-bottom: 20px; }
        .btn { width: 100%; background: var(--fcapt-primary); color: white; padding: 16px; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; }
        .theme-toggle { position: fixed; bottom: 20px; right: 20px; width: 50px; height: 50px; border-radius: 50%; background: var(--fcapt-primary); color: white; border: none; cursor: pointer; }
        .logout-link { display: block; text-align: center; color: var(--text-muted); text-decoration: none; margin-top: 20px; }
   </head>
<body>
    <header class="header">
        <img src="logo.png" alt="Logo" class="logo-img">
        <h2 style="margin:0">FCAPT | STUDENT PORTAL</h2>
        <div class="user-badge" id="student-meta">Loading Profile...</div>
    </header>

    <main class="container">
        <div class="card">
            <h3>Mark Attendance</h3>
            <select id="course-select"><option value="">Select Course...</option></select>
            <button class="btn" onclick="markAttendance()">Confirm Presence</button>
        </div>
        <div class="card">
            <h3 style="margin-top:0;">My Overview</h3>
            <div id="stats-container"><p>Select a course to view stats.</p></div>
        </div>
        <a href="#" class="logout-link" onclick="logout()">Sign Out</a>
    </main>
    <button class="theme-toggle" onclick="toggleTheme()">🌓</button>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SB_URL = 'https://loblicverqcijkqatvhs.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvYmxpY3ZlcnFjaWprcWF0dmhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMTAyOTYsImV4cCI6MjA5MTY4NjI5Nn0.vV-rpPzniYgSTzBStfikL_SJc722-41ezkiJnI4nOPs';
        const supabaseClient = supabase.createClient(SB_URL, SB_KEY);
        const user = JSON.parse(localStorage.getItem('fcapt_user'));

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const target = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', target);
            localStorage.setItem('fcapt_theme', target);
        }
        document.documentElement.setAttribute('data-theme', localStorage.getItem('fcapt_theme') || 'light');

        async function init() {
            document.getElementById('student-meta').innerText = `${user.program} | ${user.student_class} | ${user.reg_num}`;
            const { data: courses } = await supabaseClient.from('courses').select('*');
            const select = document.getElementById('course-select');
            courses.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.id;
                opt.textContent = `${c.course_code}: ${c.course_title}`;
                select.appendChild(opt);
            });
        }

        async function markAttendance() {
            const cid = document.getElementById('course-select').value;
            if(!cid) return alert("Select a course");
            await supabaseClient.from('attendance').insert([{ student_id: user.id, course_id: cid }]);
            alert("Attendance Marked!");
        }

        function logout() { localStorage.clear(); window.location.href = 'index.html'; }
        init();
    </script>
</body>
</html>

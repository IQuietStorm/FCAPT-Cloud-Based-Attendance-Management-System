<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal | FCAPT</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header style="background: var(--fcapt-primary); color: white; padding: 1rem 2rem;">
        <h2 id="s-name" style="margin:0">...</h2>
        <small id="s-meta">...</small>
    </header>

    <main class="container">
        <div class="card">
            <h3>Mark Attendance</h3>
            <select id="c-sel" style="margin-bottom:1rem;"></select>
            <button class="btn" onclick="mark()" style="width:100%;">Confirm Presence</button>
        </div>
        <div class="card" style="margin-top:20px;">
            <h3>My Stats</h3>
            <div id="stats"></div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="main.js"></script>
    <script>
        const SB_URL = 'https://loblicverqcijkqatvhs.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvYmxpY3ZlcnFjaWprcWF0dmhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMTAyOTYsImV4cCI6MjA5MTY4NjI5Nn0.vV-rpPzniYgSTzBStfikL_SJc722-41ezkiJnI4nOPs';
        const supabaseClient = supabase.createClient(SB_URL, SB_KEY);
        const user = JSON.parse(localStorage.getItem('fcapt_user'));

        async function init() {
            document.getElementById('s-name').innerText = user.full_name;
            document.getElementById('s-meta').innerText = `${user.program} - ${user.student_class}`;
            const { data: courses } = await supabaseClient.from('courses').select('*');
            const sel = document.getElementById('c-sel');
            courses.forEach(c => sel.innerHTML += `<option value="${c.id}">${c.course_code}</option>`);
        }

        async function mark() {
            const cid = document.getElementById('c-sel').value;
            await supabaseClient.from('attendance').insert([{ student_id: user.id, course_id: cid }]);
            alert("Presence Marked!");
        }
        init();
    </script>
</body>
</html>

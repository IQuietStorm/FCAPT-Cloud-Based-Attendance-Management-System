<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FCAPT Student Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --fcapt-primary: #1e4620;
            --fcapt-bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --accent: #3b82f6;
        }

        [data-theme="dark"] {
            --fcapt-bg: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--fcapt-bg);
            color: var(--text-main);
            margin: 0;
            transition: 0.3s;
            padding-bottom: 40px;
        }

        /* Navigation */
        nav {
            background: var(--card-bg);
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header Card - Responsive */
        .header-card {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        @media (min-width: 768px) {
            .header-card { flex-direction: row; justify-content: space-between; align-items: center; }
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        @media (min-width: 768px) {
            .stats-grid { grid-template-columns: repeat(3, 1fr); }
        }

        .stat-box {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .stat-label { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); uppercase; letter-spacing: 0.05em; }
        .stat-value { font-size: 1.5rem; font-weight: 800; margin-top: 5px; color: var(--fcapt-primary); }

        /* Table Area */
        .table-container {
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: var(--fcapt-bg); padding: 15px; font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; }
        td { padding: 15px; border-top: 1px solid var(--border-color); font-size: 0.95rem; }

        .theme-toggle {
            width: 40px; height: 40px; border-radius: 50%;
            background: var(--fcapt-primary); color: white;
            border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }

        .badge { background: #dcfce7; color: #166534; padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
    </style>
</head>
<body>

    <nav>
        <div style="font-weight: 800; color: var(--fcapt-primary);">FCAPT | PORTAL</div>
        <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
    </nav>

    <div class="container">
        <div class="header-card">
            <div>
                <span class="stat-label">Student Name</span>
                <h2 style="margin: 5px 0; font-size: 1.8rem;" id="disp-name">Loading...</h2>
                <span class="stat-label" style="font-family: monospace;">ID: 065**********</span>
            </div>
            <div style="text-align: right;">
                <span class="badge">Week 8</span>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-label">Attendance</div>
                <div class="stat-value" id="disp-attendance">0%</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Program</div>
                <div class="stat-value" id="disp-program" style="font-size: 1.2rem;">---</div>
            </div>
            <div class="stat-box">
                <div class="stat-box-inner">
                    <div class="stat-label">Class</div>
                    <div class="stat-value" id="disp-class" style="font-size: 1.2rem;">---</div>
                </div>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Course Module</th>
                        <th style="text-align: right;">Attendance</th>
                    </tr>
                </thead>
                <tbody id="course-list">
                    <tr>
                        <td>Synchronizing Cloud Data...</td>
                        <td style="text-align: right;">--</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Simple Theme Toggle to test CSS
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const target = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', target);
            localStorage.setItem('fcapt_theme', target);
        }
        document.documentElement.setAttribute('data-theme', localStorage.getItem('fcapt_theme') || 'light');
    </script>
</body>
</html>

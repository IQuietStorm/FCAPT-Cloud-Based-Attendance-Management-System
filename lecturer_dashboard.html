<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecturer Dashboard | FCAPT</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-lecturer">
    <header class="header header--portal">
        <div class="header-brand">
            <img src="logo.svg" alt="FCAPT Logo" class="header-logo" onerror="this.onerror=null;this.src='logo.png';">
            <div class="header-brand-text">
                <h2 id="lec-name">...</h2>
                <small id="week-info">...</small>
            </div>
        </div>
        <div class="header-actions">
            <div class="notification-panel">
                <button type="button" class="notification-bell" id="notification-bell" aria-label="Presence notifications" title="Presence notifications">
                    🔔
                    <span class="notification-badge" id="notification-badge">0</span>
                </button>
                <div class="notification-dropdown" id="notification-dropdown">
                    <div id="notification-list" class="notification-empty">No new presence check-ins yet.</div>
                </div>
            </div>
            <button class="icon-btn" type="button" onclick="toggleTheme()" aria-label="Toggle dark mode" title="Toggle theme">🌓</button>
            <button type="button" class="btn-logout" onclick="logout()">Logout</button>
        </div>
    </header>
    <main class="container">
        <div class="card">
            <h3 class="card-title">Student Attendance Report</h3>
            <div class="filters" aria-label="Filters">
                <div class="field">
                    <label for="filter-class">Class</label>
                    <select id="filter-class">
                        <option value="">All</option>
                    </select>
                </div>
                <div class="field">
                    <label for="filter-course">Course</label>
                    <select id="filter-course">
                        <option value="">All</option>
                    </select>
                </div>
                <div class="field">
                    <label for="filter-program">Program</label>
                    <select id="filter-program">
                        <option value="">All</option>
                    </select>
                </div>
                <button id="filters-reset" type="button">Reset</button>
            </div>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>Student & Class</th><th>Course</th><th>Stats</th><th>Status</th></tr></thead>
                    <tbody id="report-body"></tbody>
                </table>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SB_URL = 'https://loblicverqcijkqatvhs.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvYmxpY3ZlcnFjaWprcWF0dmhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMTAyOTYsImV4cCI6MjA5MTY4NjI5Nn0.vV-rpPzniYgSTzBStfikL_SJc722-41ezkiJnI4nOPs';
        const supabaseClient = supabase.createClient(SB_URL, SB_KEY);
        const user = JSON.parse(localStorage.getItem('fcapt_user'));
        const notifications = [];
        let seenAttendanceKeys = new Set();
        let seenNotificationIds = new Set();
        let courseById = {};
        let studentById = {};
        let myCourseIds = [];
        let myCourseIdsRaw = [];
        let dashboardReady = false;

        function normId(id) {
            return id == null ? '' : String(id).trim().toLowerCase();
        }

        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('fcapt_theme', theme);
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            setTheme(current === 'dark' ? 'light' : 'dark');
        }

        (function initTheme() {
            const saved = localStorage.getItem('fcapt_theme');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            setTheme(saved || (prefersDark ? 'dark' : 'light'));
        })();

        function attendanceKey(record) {
            if (record.id) return `id:${normId(record.id)}`;
            return `${normId(record.student_id)}-${normId(record.course_id)}-${record.week_number}`;
        }

        function notificationKey(record) {
            if (record.id) return normId(record.id);
            return `${normId(record.student_id)}-${normId(record.course_id)}-${record.week_number}-${record.created_at || ''}`;
        }

        function formatNotificationTime(value) {
            if (!value) return 'Just now';
            return new Date(value).toLocaleString();
        }

        function renderNotifications() {
            const listEl = document.getElementById('notification-list');
            const badgeEl = document.getElementById('notification-badge');
            badgeEl.textContent = String(notifications.length);
            badgeEl.classList.toggle('visible', notifications.length > 0);

            if (!notifications.length) {
                listEl.className = 'notification-empty';
                listEl.textContent = 'No new presence check-ins yet.';
                return;
            }

            listEl.className = '';
            listEl.innerHTML = notifications.map(n => `
                <div class="notification-item">
                    <strong>${n.studentName}</strong> marked presence for <strong>${n.courseCode}</strong> (Week ${n.weekNumber})
                    <time>${formatNotificationTime(n.createdAt)}</time>
                </div>
            `).join('');
        }

        function pushPresenceNotification(studentName, courseCode, weekNumber, createdAt) {
            const alreadyShown = notifications.some(n =>
                n.studentName === studentName &&
                n.courseCode === courseCode &&
                String(n.weekNumber) === String(weekNumber)
            );
            if (alreadyShown) return;

            notifications.unshift({
                studentName,
                courseCode,
                weekNumber,
                createdAt: createdAt || new Date().toISOString()
            });
            if (notifications.length > 20) notifications.length = 20;
            renderNotifications();
            showPresenceToast(studentName, courseCode, weekNumber);
        }

        function showPresenceToast(studentName, courseCode, weekNumber) {
            const existing = document.querySelector('.notification-toast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = 'notification-toast';
            toast.textContent = `${studentName} marked presence for ${courseCode} (Week ${weekNumber})`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 5000);
        }

        function handleNotificationRow(record, notifyNew) {
            const key = notificationKey(record);
            if (seenNotificationIds.has(key)) return;
            seenNotificationIds.add(key);

            if (!notifyNew) {
                notifications.push({
                    studentName: record.student_name || 'A student',
                    courseCode: record.course_code || 'Course',
                    weekNumber: record.week_number ?? '-',
                    createdAt: record.created_at
                });
                return;
            }

            pushPresenceNotification(
                record.student_name || 'A student',
                record.course_code || 'Course',
                record.week_number ?? '-',
                record.created_at
            );
        }

        function registerAttendanceRecords(records, notifyNew) {
            records.forEach(record => {
                const courseId = normId(record.course_id);
                if (!myCourseIds.includes(courseId)) return;

                const key = attendanceKey(record);
                if (seenAttendanceKeys.has(key)) return;
                seenAttendanceKeys.add(key);

                if (!notifyNew) return;

                const student = studentById[normId(record.student_id)] || studentById[record.student_id];
                const course = courseById[courseId] || courseById[record.course_id];

                pushPresenceNotification(
                    student?.full_name || record.student_name || 'A student',
                    course?.course_code || record.course_code || 'Course',
                    record.week_number,
                    record.created_at
                );
            });
        }

        async function pollAttendanceNotifications() {
            if (!myCourseIdsRaw.length) return;
            const { data, error } = await supabaseClient
                .from('attendance')
                .select('*')
                .in('course_id', myCourseIdsRaw);
            if (!error && data) registerAttendanceRecords(data, dashboardReady);
        }

        async function pollNotificationRows() {
            const { data, error } = await supabaseClient
                .from('notifications')
                .select('*')
                .eq('lecturer_id', user.id)
                .eq('read', false)
                .order('created_at', { ascending: false })
                .limit(30);

            if (error) return;
            (data || []).forEach(row => handleNotificationRow(row, dashboardReady));
            if (dashboardReady) renderNotifications();
        }

        async function loadStoredNotifications() {
            const { data, error } = await supabaseClient
                .from('notifications')
                .select('*')
                .eq('lecturer_id', user.id)
                .eq('read', false)
                .order('created_at', { ascending: false })
                .limit(20);

            if (error || !data) return;
            data.forEach(n => handleNotificationRow(n, false));
            renderNotifications();
        }

        function setupNotificationUi() {
            const bell = document.getElementById('notification-bell');
            const dropdown = document.getElementById('notification-dropdown');

            bell.addEventListener('click', (e) => {
                e.stopPropagation();
                dropdown.classList.toggle('open');
            });

            document.addEventListener('click', () => dropdown.classList.remove('open'));
            dropdown.addEventListener('click', (e) => e.stopPropagation());
        }

        function setupPresenceBroadcastListener() {
            if (typeof BroadcastChannel === 'undefined') return;
            const channel = new BroadcastChannel('fcapt-presence');
            channel.onmessage = (event) => {
                const msg = event.data || {};
                if (normId(msg.lecturerId) !== normId(user.id)) return;
                pushPresenceNotification(
                    msg.studentName || 'A student',
                    msg.courseCode || 'Course',
                    msg.weekNumber ?? '-',
                    msg.createdAt || new Date().toISOString()
                );
            };
        }

        function subscribeToLiveUpdates() {
            const channel = supabaseClient.channel(`lecturer-live-${user.id}`);

            if (myCourseIds.length) {
                channel.on('postgres_changes', {
                    event: 'INSERT',
                    schema: 'public',
                    table: 'attendance'
                }, payload => {
                    registerAttendanceRecords([payload.new], true);
                });
            }

            channel.on('postgres_changes', {
                event: 'INSERT',
                schema: 'public',
                table: 'notifications',
                filter: `lecturer_id=eq.${user.id}`
            }, payload => {
                handleNotificationRow(payload.new, true);
            });

            channel.subscribe((status) => {
                if (status === 'SUBSCRIBED') console.log('[FCAPT] Live notifications connected');
            });
        }

        async function refreshNotificationWatchers() {
            await Promise.all([pollNotificationRows(), pollAttendanceNotifications()]);
        }

        async function init() {
            if (!user) window.location.href = 'index.html';
            document.getElementById('lec-name').innerText = "Lec. " + user.full_name;

            const filterClassEl = document.getElementById('filter-class');
            const filterCourseEl = document.getElementById('filter-course');
            const filterProgramEl = document.getElementById('filter-program');
            const resetFiltersEl = document.getElementById('filters-reset');

            const { data: settings } = await supabaseClient.from('settings').select('*').single();
            const start = new Date(settings.resumption_date);
            const end = new Date(settings.semester_end_date);
            const totalWeeks = Math.ceil((end - start) / (7 * 24 * 60 * 60 * 1000));
            document.getElementById('week-info').innerText = `Total Semester Duration: ${totalWeeks} Weeks`;

            const { data: myCourses } = await supabaseClient.from('courses').select('*').eq('lecturer_id', user.id);
            myCourseIds = (myCourses || []).map(c => normId(c.id));
            myCourseIdsRaw = (myCourses || []).map(c => c.id);
            courseById = Object.fromEntries((myCourses || []).map(c => [normId(c.id), c]));
            let att = [];
            if (myCourseIdsRaw.length) {
                const { data: attendanceRows } = await supabaseClient.from('attendance').select('*').in('course_id', myCourseIdsRaw);
                att = attendanceRows || [];
            }
            const { data: students } = await supabaseClient.from('profiles').select('*').eq('role', 'student');
            studentById = Object.fromEntries((students || []).flatMap(s => [
                [normId(s.id), s],
                [s.id, s]
            ]));

            setupNotificationUi();
            setupPresenceBroadcastListener();
            registerAttendanceRecords(att || [], false);
            await loadStoredNotifications();
            subscribeToLiveUpdates();
            dashboardReady = true;
            await refreshNotificationWatchers();
            setInterval(refreshNotificationWatchers, 4000);
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) refreshNotificationWatchers();
            });

            const tbody = document.getElementById('report-body');
            const fragment = document.createDocumentFragment();
            const classSet = new Set();
            const courseSet = new Set();
            const programSet = new Set();

            function safeText(v) {
                return (v === null || v === undefined) ? '' : String(v);
            }

            (students || []).forEach(s => {
                (myCourses || []).forEach(c => {
                    const count = att.filter(a => a.student_id === s.id && a.course_id === c.id).length;
                    if (count <= 0) return;

                    const program = safeText(s.program).trim();
                    const studentClass = safeText(s.student_class).trim();
                    const courseCode = safeText(c.course_code).trim();

                    if (studentClass) classSet.add(studentClass);
                    if (courseCode) courseSet.add(courseCode);
                    if (program) programSet.add(program);

                    const p = Math.round((count / totalWeeks) * 100);
                    const tr = document.createElement('tr');
                    tr.dataset.class = studentClass;
                    tr.dataset.course = courseCode;
                    tr.dataset.program = program;
                    tr.innerHTML = `
                        <td><strong>${safeText(s.full_name)}</strong><br><small style="color:var(--text-muted)">${program} (${studentClass})</small></td>
                        <td>${courseCode}</td>
                        <td>${p}% (${count}/${totalWeeks})</td>
                        <td><span class="badge ${p < 75 ? 'danger' : 'success'}">${p < 75 ? 'Shortfall' : 'Eligible'}</span></td>
                    `;
                    fragment.appendChild(tr);
                });
            });

            tbody.innerHTML = '';
            tbody.appendChild(fragment);

            function fillSelect(selectEl, values) {
                const current = selectEl.value;
                selectEl.querySelectorAll('option:not([value=""])').forEach(o => o.remove());
                values
                    .filter(Boolean)
                    .sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }))
                    .forEach(v => {
                        const opt = document.createElement('option');
                        opt.value = v;
                        opt.textContent = v;
                        selectEl.appendChild(opt);
                    });
                selectEl.value = current;
            }

            fillSelect(filterClassEl, Array.from(classSet));
            fillSelect(filterCourseEl, Array.from(courseSet));
            fillSelect(filterProgramEl, Array.from(programSet));

            function applyFilters() {
                const cls = filterClassEl.value;
                const course = filterCourseEl.value;
                const program = filterProgramEl.value;

                Array.from(tbody.querySelectorAll('tr')).forEach(tr => {
                    const ok =
                        (!cls || tr.dataset.class === cls) &&
                        (!course || tr.dataset.course === course) &&
                        (!program || tr.dataset.program === program);
                    tr.style.display = ok ? '' : 'none';
                });
            }

            filterClassEl.addEventListener('change', applyFilters);
            filterCourseEl.addEventListener('change', applyFilters);
            filterProgramEl.addEventListener('change', applyFilters);
            resetFiltersEl.addEventListener('click', () => {
                filterClassEl.value = '';
                filterCourseEl.value = '';
                filterProgramEl.value = '';
                applyFilters();
            });
        }
        function logout() { localStorage.clear(); window.location.href = 'index.html'; }
        init();
    </script>
</body>
</html>

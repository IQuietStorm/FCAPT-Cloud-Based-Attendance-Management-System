<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecturer Portal | FCAPT</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header style="background: var(--fcapt-primary); color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center;">
        <h2 id="lec-title" style="margin:0">Lecturer Dashboard</h2>
        <button class="btn" onclick="logout()" style="background:rgba(255,255,255,0.2);">Logout</button>
    </header>

    <main class="container">
        <div class="card" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px;">
            <div><label>Course</label><select id="f-course" onchange="filter()"><option value="all">All Courses</option></select></div>
            <div><label>Program</label><select id="f-prog" onchange="filter()"><option value="all">All Programs</option><option value="CPS">CPS</option><option value="AEM">AEM</option></select></div>
            <div><label>Class</label><select id="f-class" onchange="filter()"><option value="all">All Years</option><option value="ND I">ND I</option><option value="ND II">ND II</option></select></div>
        </div>

        <div class="card table-container">
            <table id="report">
                <thead><tr><th>Student</th><th>Program/Class</th><th>Course</th><th>Attendance</th><th>Status</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="main.js"></script>
    <script>
        const SB_URL = 'https://loblicverqcijkqatvhs.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvYmxpY3ZlcnFjaWprcWF0dmhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMTAyOTYsImV4cCI6MjA5MTY4NjI5Nn0.vV-rpPzniYgSTzBStfikL_SJc722-41ezkiJnI4nOPs';
        const supabaseClient = supabase.createClient(SB_URL, SB_KEY);
        const user = JSON.parse(localStorage.getItem('fcapt_user'));
        let master = [];

        async function init() {
            document.getElementById('lec-title').innerText = "Lec. " + user.full_name;
            const { data: myCourses } = await supabaseClient.from('courses').select('*').eq('lecturer_id', user.id);
            const { data: att } = await supabaseClient.from('attendance').select('*');
            const { data: students } = await supabaseClient.from('profiles').select('*').eq('role', 'student');
            
            const csel = document.getElementById('f-course');
            myCourses.forEach(c => {
                csel.innerHTML += `<option value="${c.id}">${c.course_code}</option>`;
                students.forEach(s => {
                    const count = att.filter(a => a.student_id === s.id && a.course_id === c.id).length;
                    if(count > 0) master.push({ s, c, count, p: Math.round((count/12)*100) });
                });
            });
            filter();
        }

        function filter() {
            const c = document.getElementById('f-course').value;
            const p = document.getElementById('f-prog').value;
            const cl = document.getElementById('f-class').value;
            const filtered = master.filter(m => (c === 'all' || m.c.id == c) && (p === 'all' || m.s.program === p) && (cl === 'all' || m.s.student_class === cl));
            
            const tbody = document.querySelector('#report tbody');
            tbody.innerHTML = '';
            filtered.forEach(m => {
                tbody.innerHTML += `<tr><td>${m.s.full_name}</td><td>${m.s.program} ${m.s.student_class}</td><td>${m.c.course_code}</td><td>${m.p}%</td><td>${m.p < 75 ? '❌ Short' : '✅ OK'}</td></tr>`;
            });
        }
        init();
    </script>
</body>
</html>

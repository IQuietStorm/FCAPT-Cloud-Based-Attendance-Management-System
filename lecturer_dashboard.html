<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FCAPT Portal | Lecturer Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --fcapt-primary: #1e4620;
            --fcapt-bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --accent-blue: #2563eb;
        }

        [data-theme="dark"] {
            --fcapt-bg: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--fcapt-bg);
            color: var(--text-main);
            margin: 0;
            transition: 0.3s;
            padding-bottom: 50px;
        }

        nav {
            background: var(--card-bg);
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Lecturer Profile Header */
        .lecturer-header {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        @media (min-width: 768px) {
            .lecturer-header { flex-direction: row; justify-content: space-between; align-items: center; }
        }

        .role-badge {
            background: rgba(30, 70, 32, 0.1);
            color: var(--fcapt-primary);
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        /* Course Cards Grid */
        .course-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .course-grid { grid-template-columns: repeat(2, 1fr); }
        }

        .course-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .course-card:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }

        .course-code { font-weight: 800; color: var(--accent-blue); font-size: 0.8rem; margin-bottom: 5px; }
        .course-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 15px; }

        .btn-action {
            background: var(--fcapt-primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .theme-toggle {
            width: 40px; height: 40px; border-radius: 50%;
            background: var(--fcapt-primary); color: white;
            border: none; cursor: pointer;
        }

        .logout-link { color: #ef4444; font-size: 0.85rem; cursor: pointer; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>

    <nav>
        <div style="font-weight: 800; color: var(--fcapt-primary);">FCAPT | LECTURER</div>
        <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
    </nav>

    <div class="container">
        <div class="lecturer-header">
            <div>
                <span class="role-badge">Academic Staff</span>
                <h2 style="margin: 10px 0 5px 0;" id="lecturer-name">Loading Profile...</h2>
                <span style="color: var(--text-muted); font-size: 0.9rem;">Department of Computer Science</span>
            </div>
            <div style="text-align: right;">
                <a href="#" class="logout-link" onclick="logout()">Sign Out</a>
            </div>
        </div>

        <h3 style="margin-bottom: 20px;">My Assigned Courses</h3>

        <div class="course-grid" id="course-container">
            <div class="course-card">
                <p style="color: var(--text-muted);">Fetching assigned modules...</p>
            </div>
        </div>
    </div>

    <script>
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const target = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', target);
            localStorage.setItem('fcapt_theme', target);
        }
        document.documentElement.setAttribute('data-theme', localStorage.getItem('fcapt_theme') || 'light');

        function logout() {
            localStorage.removeItem('fcapt_user');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
